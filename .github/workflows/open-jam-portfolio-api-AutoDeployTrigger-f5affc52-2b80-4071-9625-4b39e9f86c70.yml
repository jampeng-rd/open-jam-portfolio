name: Trigger auto deployment for open-jam-portfolio-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/open-jam-portfolio-api-AutoDeployTrigger-f5affc52-2b80-4071-9625-4b39e9f86c70.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OPENJAMPORTFOLIOAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OPENJAMPORTFOLIOAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OPENJAMPORTFOLIOAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.OPENJAMPORTFOLIOAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.OPENJAMPORTFOLIOAPI_REGISTRY_PASSWORD }}
          containerAppName: open-jam-portfolio-api
          resourceGroup: open-jam-portfolio-rg
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


