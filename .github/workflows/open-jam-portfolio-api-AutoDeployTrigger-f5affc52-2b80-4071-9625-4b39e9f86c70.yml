name: Trigger auto deployment for open-jam-portfolio-api

on:
  push:
    branches:
      - master
    paths:
      - "API/Portfolio.API/**"
      - ".github/workflows/open-jam-portfolio-api-AutoDeployTrigger-f5affc52-2b80-4071-9625-4b39e9f86c70.yml"

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.OPENJAMPORTFOLIOAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OPENJAMPORTFOLIOAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OPENJAMPORTFOLIOAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/API/Portfolio.API
          dockerfilePath: Portfolio.API/Dockerfile

          registryUrl: docker.io
          registryUsername: ${{ secrets.DOCKERHUB_USERNAME }}
          registryPassword: ${{ secrets.DOCKERHUB_TOKEN }}

          imageToBuild: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/open-jam-portfolio-api:${{ github.sha }}

          containerAppName: open-jam-portfolio-api
          resourceGroup: open-jam-portfolio-rg
          containerAppEnvironment: open-jam-portfolio-env

          ingress: external
          targetPort: 8080
