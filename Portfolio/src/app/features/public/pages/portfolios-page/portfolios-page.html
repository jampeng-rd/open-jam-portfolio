<section class="portfolio-section">
    <div class="container my-5">
        @if (isLoading()) {
            <div class="d-flex justify-content-center py-5">
                <div class="spinner-border text-dark" role="status">
                    <span class="visually-hidden">載入中...</span>
                </div>
            </div>
        } @else if (errorMessage()) {
            <div class="alert alert-danger" role="alert">
                {{ errorMessage() }}
            </div>
        } @else {
            <div class="row row-cols-1 row-cols-md-3 g-4">
                @for (portfolio of portFolios() ; track portfolio.id) {
                    <div class="col d-flex">
                        <article class="card portfolio-card h-100 w-100">
                            <img
                                [src]="portfolio.imageUrl"
                                [alt]="portfolio.name"
                                class="card-img-top portfolio-card__image"
                            >
    
                            <div class="card-body d-flex flex-column">
                                <h3 class="card-title portfolio-card__title">{{ portfolio.name }}</h3>
    
                                <p class="card-text text-secondary portfolio-card__description">
                                    {{ portfolio.shortDescription }}
                                </p>
    
                                <div class="mt-auto pt-3">
                                    <a [routerLink]="['/portfolio', portfolio.name]" class="btn btn-primary">
                                        Read More
                                    </a>
                                </div>
                            </div>
                        </article>
                    </div>
                }   @empty {
                    <div class="col-12">
                        <p class="text-secondary text-center py-5">
                            目前沒有作品資料。
                        </p>
                    </div>
                }
            </div>
        }
    </div>
</section>
