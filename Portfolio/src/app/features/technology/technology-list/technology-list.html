<div class="container">
    <h1 class="mt-3">技能清單</h1>

    <div class="d-flex justify-content-end mt-3">
        <a [routerLink]="['/admin', 'technologys', 'add']" class="btn btn-primary">新增技能</a>
    </div>

    @if (isLoading()) {
        <div class="spinner-border text-dark" role="status">
            <span class="visually-hidden">載入中...</span>
        </div>
    } @else if (errorMessage()) {
        <p>{{ errorMessage() }}</p>
    } @else {
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>名稱</th>
                    <th>IconUrl</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                @for (technology of technologies() ; track technology.id) {
                    <tr>
                        <td>{{technology.id}}</td>
                        <td>{{technology.name}}</td>
                        <td>{{technology.iconUrl}}</td>
                        <td>
                            <a class="btn btn-light btn-sm" [routerLink]="['/admin', 'technologys', 'edit', technology.id]">編輯</a>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    }

</div>
