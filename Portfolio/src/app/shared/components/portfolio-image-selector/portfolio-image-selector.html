@if (showImageSelector()) {
    <div class="image-selector-container">
        <div class="card h-100">
            <div class="card-header d-flex justify-content-between">
                <h3 class="card-title">Images</h3>
                <button class="btn btn-light" type="button" (click)="hideImageSelector()">x</button>
            </div>
    
            <div class="card-body">
                <div class="d-flex flex-md-row flex-sm-column flex-wrap">

                    <!-- Display all images -->
                    <div class="col-8 p-4">
                        @if (isLoading()) {
                            <p>Loading...</p>
                        } @else {
                            <div class="d-flex flex-wrap overflow-auto" style="max-height: calc(100vh - 300px);">
                                @for (image of response(); track image.id) {
                                    <div class="d-flex flex-column align-items-center">
                                        <div class="d-flex flex-column align-items-center p-4" role="button" (click)="onSelectImage(image)">
                                            <img [src]="image.url" [alt]="image.fileName" style="height: 100px;">
                                            <span>{{image.fileName}}</span>
                                        </div>
                                        <button type="button" class="btn btn-danger btn-sm col-4" (click)="onDelete(image)">刪除</button>
                                    </div>
                                }
                            </div>
                        }
                    </div>

                    <!-- Upload image -->
                    <div class="col-4 p-4 bg-light">
                        <h5>Upload Image</h5>

                        <form [formGroup]="imageSelectorUploadForm" (ngSubmit)="onSubmit()">
                            <div class="mt-3">
                                <input type="file" class="form-control" (change)="onFileSelected($event)">
                            </div>
    
                            <div class="mt-3">
                                <input type="text" class="form-control" placeholder="File Name" formControlName="name">
                            </div>

                            <div class="mt-3">
                                <button type="submit" class="btn btn-dark">Upload</button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
    
        </div>
    </div>
}
